<!DOCTYPE html>
<html>
  <head>
    <title>Password Generator</title>
    <meta charset="UTF-8">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 14px 16px;
        min-width: 240px;
        color: #222;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #2b2a2a; color: #ccc; }
        a { color: #7ac5f8; }
      }
      h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
      p { margin: 6px 0; line-height: 1.5; }
      .tip { color: #555; font-size: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
    </style>
  </head>
  <body>
    <h2>🔑 Password Generator</h2>
    <p><strong>Generator-only mode</strong> — no KeePassXC connection required.</p>
    <p>A key icon appears next to password fields on web pages.<br>
       Click it to generate a secure password and fill the field.</p>
    <p class="tip">
      Keyboard shortcut: <kbd>Alt+Shift+G</kbd> (Windows/Linux)<br>
      <kbd>Ctrl+Shift+G</kbd> (macOS)
    </p>
  </body>
</html>
